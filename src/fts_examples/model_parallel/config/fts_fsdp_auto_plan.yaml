trainer:
  max_epochs: 4
  callbacks+:
  - class_path: finetuning_scheduler.FinetuningScheduler
    init_args:
      ft_schedule: ./config/defaults/llama_ft_schedule.yaml
      max_depth: 2
      strategy_adapter_cfg:
        fsdp_default_kwargs:
          reshard_after_forward: True  # default value of a normal ``fully_shard`` kwarg
          act_ckpt: ['composable']  # use composable AC with default kwargs
        # the transformer itself last, so its embeddings are sharded too: a parameter outside every FSDP module would be
        # a plain tensor beside the DTensors in the optimizer's parameter groups. `model.norm` gets its own unit: left
        # to the transformer's, which reshards after forward, it would thaw in phase 0 beside the embeddings (phase 2)
        # and every backward pass would all-gather the frozen embeddings again
        fsdp_plan: {'model.output': {}, 'model.norm': {}, 'model.layers.\d*$': {}, 'model': {}}
  strategy:
    init_args:
      data_parallel_size: 2
      tensor_parallel_size: 1
  logger:
    init_args:
      name: fts_fsdp_auto_plan
