# FSDP2 on two data-parallel ranks: the plain PyTorch counterpart of `fts_fsdp_auto_plan.yaml`. The plan is the
# Lightning configuration's `fsdp_plan`; `apply_fsdp_plan` shards the root module after the planned modules.
run_name: torch_fsdp_plan
mesh:
  data_parallel_size: 2
  tensor_parallel_size: 1
fsdp_default_kwargs:
  reshard_after_forward: True  # default value of a normal ``fully_shard`` kwarg
  act_ckpt: ['composable']  # use composable AC with default kwargs
  # cpu_offload_policy: {}  # apply default cpu offload policy
fsdp_plan: {'model.output': {}, 'model.layers.\d*$': {}}
