# Initial score training uses the original regex syntax. Later phases use shared address sets.
# Phases accumulate trainable score tensors; fixed base/delta tensors are never thawed.
addresses: matryoshka_mask_sets.yaml
0:
  params: ['model\.layers\.\d+\.mlp\.up_proj\.mask_scores']
  max_transition_epoch: 1
1:
  params: ["@top_attention"]
  max_transition_epoch: 2
2:
  params: ["@remaining_attention"]
  max_transition_epoch: 3
