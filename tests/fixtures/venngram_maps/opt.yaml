# OPT (transformers `OPTForCausalLM`). Pre-norm blocks (the default `do_layer_norm_before`) whose MLP is not a module of
# its own: `fc1` and `fc2` sit on the layer, so there is no `mlp` row, only `mlp.in` and `mlp.out`. The sizes that
# project between a smaller embedding and the hidden width (`project_in`, `project_out`) are not mapped.
schema_version: 2
architecture: OPTForCausalLM
properties:
  sandwich_norms: false
components:
  embed:              {module: "model.decoder.embed_tokens",                     kind: embed}
  pos_embed:          {module: "model.decoder.embed_positions",                  kind: embed}
  blocks.{i}:         {module: "model.decoder.layers.{i}",                       kind: block}
  blocks.{i}.ln1:     {module: "model.decoder.layers.{i}.self_attn_layer_norm",  kind: norm}
  blocks.{i}.attn:    {module: "model.decoder.layers.{i}.self_attn",             kind: attn}
  blocks.{i}.attn.q:  {module: "model.decoder.layers.{i}.self_attn.q_proj",      kind: linear}
  blocks.{i}.attn.k:  {module: "model.decoder.layers.{i}.self_attn.k_proj",      kind: linear}
  blocks.{i}.attn.v:  {module: "model.decoder.layers.{i}.self_attn.v_proj",      kind: linear}
  blocks.{i}.attn.o:  {module: "model.decoder.layers.{i}.self_attn.out_proj",    kind: linear}
  blocks.{i}.ln2:     {module: "model.decoder.layers.{i}.final_layer_norm",      kind: norm}
  blocks.{i}.mlp.in:  {module: "model.decoder.layers.{i}.fc1",                   kind: linear}
  blocks.{i}.mlp.out: {module: "model.decoder.layers.{i}.fc2",                   kind: linear}
  ln_final:           {module: "model.decoder.final_layer_norm",                 kind: norm}
  unembed:            {module: "lm_head",                                        kind: unembed}
