# The multi-GPU pipeline on the self-hosted GPU agents: pull requests into main and release branches, builds of main,
# release branches and tags, and a nightly full run.

trigger:
  # tags:
  #   include:
  #     - '*'
  branches:
    include:
      - "main"
      - "release/*"
      # - "model_parallel_exp_support"  # temporarily add for specific feature branch validation
      - "refs/tags/*"
  paths:
    include:
      - "setup.*"  # setup.py
      - "pyproject.toml"
      - ".codecov.yml"
      - "tests/**"
      - "src/**"
      - "requirements/**"
      - ".azure-pipelines/**"
pr:
  branches:
    include:
    - main
    - release/*
  paths:
    include:
      - "setup.*"  # setup.py
      - "pyproject.toml"
      - ".codecov.yml"
      - "tests/**"
      - "src/**"
      - "requirements/**"
      - ".azure-pipelines/**"
  drafts: false  # Only run for PRs that are "ready for review"
# The nightly full run (#57's T3): every standalone test and the examples (a scheduled build's standalone scope is
# `full`), plus the distributed pool in reverse order. Only when main has changed since the last scheduled run, and
# at 06:00 UTC, clear of interpretune's 10:00 UTC nightly on the same agent. Like every build on this pool it waits
# for its gate to be approved.
schedules:
  - cron: "0 6 * * *"
    displayName: "Nightly full GPU suite (when main changed)"
    branches:
      include:
        - main
    always: false

parameters:
  # The images each vendor's agent runs, digest-pinned (the template refuses an undigested one). The NVIDIA image comes
  # first: scripts/verify_version_consistency.py reads its tag for the torch, Python and Lightning versions.
  - name: images
    type: object
    default:
      nvidia: "speediedan/finetuning-scheduler:py3.13-pt2.15.0-pl2.6-azpl-init@sha256:7a3c80e93d8030b58b39d6c4db1e6db9510f2a161e3c8ae4c3fb62a06a97eacc"
      amd: "speediedan/finetuning-scheduler:py3.13-pt2.15.0-pl2.6-rocm10.0-azpl-init@sha256:9c735f177b231baabcfe608e85d32bec4823e105e26b5b797994dd1dcfd27c9e"
  # A manual run may pin one vendor's agent; every triggered build runs on either.
  - name: vendor
    type: string
    default: any
    values: [any, nvidia, amd]

# One job, on whichever GPU agent is free (#57): the any-vendor template picks the image and device options from the
# vendor the agent declares, runs the GPU phases under the host leases, uploads the GPU coverage, and fails when a
# phase's report is not clean. A release's green on each vendor is not this pipeline's: release legs demand their
# vendor and are queued deliberately, after the AMD agent is switched to release mode, so a triggered build never
# waits on or fails for an agent that is not taking release work. The phases
# (.azure-pipelines/scripts/gpu_job_container.sh):
#   - the CUDA tests that are not standalone (the hosted CPU matrix runs every other test in that collection);
#   - the standalone tests: on a pull request into main, the smoke set unless it carries the `full-gpu-suite` label,
#     and otherwise all of them (.azure-pipelines/scripts/standalone_scope.sh);
#   - the examples and the multi-GPU examples;
#   - on the nightly run only, the persistent distributed pool's modules in reverse order (FTS_REVERSE_ORDER), so a
#     case that leaves state for the next one in its pool fails.
jobs:
  - template: templates/gpu-job.yml
    parameters:
      jobName: pytest
      vendor: ${{ parameters.vendor }}
      jobClass: ci-any-vendor
      scope: auto
      poolReverse: ${{ eq(variables['Build.Reason'], 'Schedule') }}
      uploadCoverage: true
      images: ${{ parameters.images }}
