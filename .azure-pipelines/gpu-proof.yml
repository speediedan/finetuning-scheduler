# The any-vendor template's admission proof (#57): one full run of .azure-pipelines/templates/gpu-job.yml with every
# phase reported clean, before an agent's `ci` mode may be used. Admitted only by `ci-proof`, a capability the operator
# gives the agent under proof and no other, so the run cannot land on the always-on CI agent and no ordinary job can
# land on the agent under proof. Queued by hand only; the project's Approval check gates every run.
trigger: none
pr: none

parameters:
  - name: scope
    type: string
    default: full
    values: [smoke, full]

jobs:
  - template: templates/gpu-job.yml
    parameters:
      jobName: proof_any_vendor
      vendor: any
      jobClass: ci-proof
      scope: ${{ parameters.scope }}
      images:
        nvidia: "speediedan/finetuning-scheduler:py3.13-pt2.15.0-pl2.6-azpl-init@sha256:b736deaecaa51b3a9de03186c8d81db050bc649a2d474d29cd9a216e61e2e3cb"
        amd: "speediedan/finetuning-scheduler:py3.13-pt2.15.0-pl2.6-rocm10.0-azpl-init@sha256:07bc4bb6f937e801b3289dfd5f83ae36dda3bdc5a56006f7e092e19143188b17"
