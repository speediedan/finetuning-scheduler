name: PyPI

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
  push:
    branches: [main, "release/*"]
  release:
    types: [published]

jobs:
  build-package:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: >-
        python -m pip install --user --upgrade build twine setuptools

    - name: Build packages
      run: |
        python -m build
        ls -lh dist/

    - uses: actions/upload-artifact@v4
      with:
        name: pypi-packages-${{ github.sha }}
        path: dist

  upload-package:
    runs-on: ubuntu-22.04
    needs: build-package
    # only upload package assets with new release
    if: github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: pypi-packages-${{ github.sha }}
        path: dist
    - run: ls -lh dist/

    - name: Upload to release
      uses: AButler/upload-release-assets@v2.0
      with:
        files: 'dist/*'
        repo-token: ${{ secrets.GITHUB_TOKEN }}

  check-pypi-environment:
    runs-on: ubuntu-22.04
    # a release reaches PyPI only once a maintainer approves the pypi environment's deployment, so a release whose
    # pypi environment requires no approval, or admits refs other than tags, stops here, before anything is published
    if: startsWith(github.event.ref, 'refs/tags') || github.event_name == 'release'
    permissions:
      actions: read
      contents: read
    steps:
    - name: Check that the pypi environment requires approval and admits only tags
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        if ! env_json=$(gh api "repos/${REPO}/environments/pypi"); then
          echo "::error::the pypi environment does not exist: create it with a required reviewer before releasing"
          exit 1
        fi
        reviewers=$(jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length' \
          <<< "${env_json}")
        if [ "${reviewers}" -lt 1 ]; then
          echo "::error::the pypi environment has no required reviewer, so nothing would stop a release reaching PyPI"
          exit 1
        fi
        if [ "$(jq -r '.deployment_branch_policy.custom_branch_policies // false' <<< "${env_json}")" != "true" ]; then
          echo "::error::the pypi environment admits every ref: give it a deployment policy admitting only release tags"
          exit 1
        fi
        policies=$(gh api "repos/${REPO}/environments/pypi/deployment-branch-policies")
        if [ "$(jq '.branch_policies | length' <<< "${policies}")" -lt 1 ] || \
           [ "$(jq '[.branch_policies[] | select(.type != "tag")] | length' <<< "${policies}")" -ne 0 ]; then
          echo "::error::the pypi environment's deployment policy must admit release tags only (for example v*)"
          jq -c '.branch_policies' <<< "${policies}"
          exit 1
        fi
        echo "pypi environment: ${reviewers} required reviewer(s), tag-only deployment policy"

  publish-package-testpypi:
    runs-on: ubuntu-22.04
    # the PyPI job waits for approval after this one, so TestPyPI runs unattended once the environment check passes
    needs: [build-package, check-pypi-environment]
    # each index's trusted publisher can be scoped to its own environment
    environment: testpypi
    permissions:
      id-token: write
    # only publish packages with new tags or release
    if: startsWith(github.event.ref, 'refs/tags') || github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: pypi-packages-${{ github.sha }}
        path: dist
    - run: ls -lh dist/

    - name: Delay releasing
      # give time to verify that the release looks good on github before proceeding with pypi
      uses: juliangruber/sleep-action@v1
      with:
        time: 3m

    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@v1.13.0
      with:
        # the action's default is PyPI itself, which made this the release's first PyPI upload
        repository-url: https://test.pypi.org/legacy/

  publish-package-pypi:
    runs-on: ubuntu-22.04
    needs: publish-package-testpypi
    # the pypi environment requires a maintainer's approval (checked by check-pypi-environment), so this job waits for
    # it: verify the TestPyPI upload, then approve the deployment
    environment:
      name: pypi
      url: https://pypi.org/p/finetuning-scheduler
    permissions:
      id-token: write
    # only publish packages with new tags or release
    if: startsWith(github.event.ref, 'refs/tags') || github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: pypi-packages-${{ github.sha }}
        path: dist
    - run: ls -lh dist/

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@v1.13.0
