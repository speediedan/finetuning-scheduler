default_language_version:
  python: python3

# .claude/skills: vendored copies of skills whose canonical form lives in speediedan/skills. Linting
# them is not merely unnecessary, it is actively wrong three ways: the hooks REWRITE them (docformatter
# and ruff reflow the bundled scripts, and blacken-docs rewrites python blocks inside the markdown),
# which desyncs `.shared-skills.sha256` whose entire purpose is to assert the copies match the master;
# the rewrite is discarded at the next sync, so the churn buys nothing; and this repo's docstring rules
# would impose its authoring standards on a repo-neutral master shared with other consumers.
# Corrections belong upstream, never to the vendored copy.
exclude: '\.claude/skills/.*'

ci:
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit suggestions'
  autoupdate_schedule: quarterly
  # submodules: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-toml
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=350', '--enforce-all']
        exclude: |
            (?x)^(
                docs/source/_static/images/fts/fts_explicit_loss_anim.gif
            )$
      - id: detect-private-key

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.17.0
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
        name: Upgrade code

  # update rev for docformatter after 1.7.6 available, using below commit on master branch until then
  - repo: https://github.com/myint/docformatter
    rev: 06907d0267368b49b9180eed423fae5697c1e909
    hooks:
      - id: docformatter
        args: [--in-place, --wrap-summaries=115, --wrap-descriptions=120]

  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa
        name: Unused noqa

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.19.0
    hooks:
      - id: blacken-docs
        args: [--line-length=120]
        additional_dependencies: [black==22.12]

  # `.claude/skills/gpu-lease/SKILL.md` is single-sourced from distributed-insight and its stored form is
  # normalized against THIS pin and plugin set, so this hook is a no-op on it. Changing `rev` or the
  # plugins (including via `pre-commit autoupdate`) may reformat the file, which silently re-creates drift
  # against the master. After any such bump: re-normalize the master, re-push it, then confirm this hook
  # leaves the file unmodified. See project_admin/shared_admin_scripts/sync-shared-skills.sh in that repo.
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          #- mdformat-black
          - mdformat_frontmatter
        exclude: CHANGELOG.md

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.6.9'
    hooks:
      - id: ruff
        # Respect `exclude` and `extend-exclude` settings.
        args:
          - "--fix"
          #- "--force-exclude"

  # `always_run: true` is load-bearing, not boilerplate. The repo-level `exclude` above applies to EVERY
  # hook, including this one, so without it pre-commit hands this hook an empty file list and reports
  # `(no files to check) Skipped` - a green result indistinguishable from a real pass, on the one check
  # whose entire job is to notice edits to the files that exclusion hides. Verify both directions after
  # touching either this block or `exclude`: a one-byte edit to a vendored skill must report `Failed` and
  # name the file, and a clean tree must report `Passed`, never `Skipped`.
  # `pass_filenames: false` because the script reads `.shared-skills.sha256` itself rather than a file list.
  - repo: local
    hooks:
      - id: check-vendored-skills
        name: Vendored skills unmodified
        entry: python scripts/check_vendored_skills.py
        language: python
        always_run: true
        pass_filenames: false
